aid: laborup
name: LaborUp
description: 'LaborUp is an AI-powered recruiting platform for American manufacturing, connecting skilled
  industrial workers — machinists, CNC programmers, welders, and maintenance technicians — with manufacturing
  employers. The platform combines voice-first AI screening, skills verification, and constraint-aware
  matching with dedicated recruiter support, and claims 5-10x faster hiring, more than 50% lower cost than
  traditional staffing agencies, 3x better post-hire retention, and a proprietary network of 25,000+ vetted
  workers. Founded by Simba Jonga, LaborUp raised $7.74M ($1.935M pre-seed plus a $5.8M seed announced in
  August 2025) led by NVP with Torch Capital, Threshold, Heartland VC, Daybreak, Westbound, Marketplace
  Capital, and Market Square Ventures. Early traction is concentrated in the Knoxville, Tennessee
  manufacturing corridor and in aerospace, shipbuilding, and critical infrastructure. As of July 2026
  LaborUp publishes no public API, developer portal, or specification; the product is delivered as a
  hosted web and mobile application.'
